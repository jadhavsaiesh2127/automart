{% extends "base.html" %}
{% block title %}Sign in — AutoMart{% endblock %}
{% block content %}
<div class="container">
  <div class="auth-shell">
    <h2>Sign in</h2>
    <p class="muted">Access your orders, addresses, and saved cart.</p>
    <form method="post">
      <div class="form-group">
        <label>Email address</label>
        <input type="email" name="email" required autofocus>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>
    <p style="margin-top:16px; font-size:0.85rem;">New to AutoMart? <a href="{{ url_for('auth.register') }}" style="color:var(--amber-dark); font-weight:600;">Create an account</a></p>
    <p style="margin-top:8px; font-size:0.78rem; color:var(--muted-2);">Demo admin: admin@automart.in / admin123</p>
  </div>
</div>
{% endblock %}
